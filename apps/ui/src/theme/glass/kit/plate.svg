<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
  <!-- Bentomotion Liquid Glass Kit (Motion Bro / AE, free): specular + caustic overlays only. No icons, no type. -->
  <defs>
    <radialGradient id="kitHot" cx="16%" cy="8%" r="52%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.58"/>
      <stop offset="0.38" stop-color="#e7f7ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6ee4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kitSpec" x1="0" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#7ad4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="kitRefract" x1="1" y1="1" x2="0.18" y2="0.22">
      <stop offset="0" stop-color="#4ec8ff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#4ec8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#kitHot)"/>
  <rect width="100" height="100" fill="url(#kitSpec)"/>
  <rect width="100" height="100" fill="url(#kitRefract)"/>
</svg>
