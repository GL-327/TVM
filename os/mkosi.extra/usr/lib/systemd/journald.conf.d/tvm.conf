# An appliance has no console to read. When TVM misbehaves on a television the
# only evidence is whatever survived the power cut, so keep the journal on disk
# and let the stick be read on another machine afterwards.
#
# Bounded, because this lives on flash and an unbounded journal would both fill
# the disk and wear it out.
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
MaxRetentionSec=1month
