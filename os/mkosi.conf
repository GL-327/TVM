# TVM appliance image.
#
# Builds a UEFI-bootable Debian disk image that starts straight into the TVM
# kiosk: no display manager, no login prompt. A Linux desktop exists behind
# the app and is opened from Settings, not at boot.
#
# Build from Linux or WSL2:  mkosi --force
# Boot the result:           mkosi vm       (or os/scripts/qemu-smoke.sh)
#
# scripts/stage-app.sh must run first: it builds the workspace into
# os/staging/, which ExtraTrees copies into the image.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
RepositoryKeyFetch=true

[Output]
Format=disk
# mkosi appends the format suffix, so this becomes tvm-appliance.raw.
Output=tvm-appliance
OutputDirectory=output

[Content]
Bootable=yes
Bootloader=systemd-boot

# Without these, systemd-firstboot stops the boot on tty1 and asks the
# television to configure itself. An appliance must never ask a question the
# remote cannot answer.
Hostname=tvm
Locale=C.UTF-8
Keymap=uk
Timezone=Europe/London

# quiet + no cursor: the panel should show TVM, never a scrolling boot log.
KernelCommandLine=quiet loglevel=3 systemd.show_status=false vt.global_cursor_default=0

# staging/ holds the built UI and core. mkosi.extra/ is picked up automatically.
ExtraTrees=staging:/

Packages=
        # Without a kernel, mkosi builds the whole image and then refuses to
        # make it bootable.
        linux-image-amd64
        systemd
        systemd-boot
        systemd-sysv
        systemd-resolved
        udev
        dbus
        ca-certificates
        # Kiosk session: a Wayland compositor that runs exactly one window.
        cage
        chromium
        # Optional Linux desktop, opened from Settings. Boot stays the kiosk.
        labwc
        waybar
        foot
        pcmanfm
        # Core runtime. Core ships as plain compiled JavaScript.
        nodejs
        # Networking, with the Wi-Fi wizard arriving in Phase 10.
        network-manager
        # Audio over HDMI.
        pipewire
        pipewire-audio
        wireplumber
        # Hardware video decode. Vendor firmware needs the non-free-firmware
        # component and is part of the Phase 10 hardware matrix.
        mesa-va-drivers
        mesa-vulkan-drivers
        va-driver-all
        # Gallium/DRI drivers. Real GPUs need these, and they are also what
        # gives software rendering inside a VM.
        libgl1-mesa-dri
        libglx-mesa0
        # Playback lands in Phase 6; the runtime is present from the start so
        # the image does not change shape later.
        mpv
        fonts-dejavu-core
        iproute2
        # Used by start-session.sh to wait for core before painting anything.
        curl

[Validation]
Checksum=yes

[Runtime]
RuntimeSize=8G
