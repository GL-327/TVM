# TVM appliance image.
#
# Builds a UEFI-bootable Debian disk image that starts straight into the TVM
# kiosk: no desktop, no display manager, no login prompt.
#
# Build from Linux or WSL2:  mkosi --force
# Boot the result:           mkosi vm       (or os/scripts/qemu-smoke.sh)
#
# scripts/stage-app.sh must run first: it builds the workspace into
# os/staging/, which ExtraTrees copies into the image.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
RepositoryKeyFetch=true

[Output]
Format=disk
Output=tvm-appliance.raw
OutputDirectory=output

[Content]
Bootable=yes
Bootloader=systemd-boot

# quiet + no cursor: the panel should show TVM, never a scrolling boot log.
KernelCommandLine=quiet loglevel=3 systemd.show_status=false vt.global_cursor_default=0

# staging/ holds the built UI and core. mkosi.extra/ is picked up automatically.
ExtraTrees=staging:/

Packages=
        systemd
        systemd-boot
        systemd-sysv
        systemd-resolved
        udev
        dbus
        ca-certificates
        # Kiosk session: a Wayland compositor that runs exactly one window.
        cage
        chromium
        # Core runtime. Core ships as plain compiled JavaScript.
        nodejs
        # Networking, with the Wi-Fi wizard arriving in Phase 10.
        network-manager
        # Audio over HDMI.
        pipewire
        pipewire-audio
        wireplumber
        # Hardware video decode. Vendor firmware needs the non-free-firmware
        # component and is part of the Phase 10 hardware matrix.
        mesa-va-drivers
        mesa-vulkan-drivers
        va-driver-all
        # Playback lands in Phase 6; the runtime is present from the start so
        # the image does not change shape later.
        mpv
        fonts-dejavu-core
        iproute2
        # Used by start-session.sh to wait for core before painting anything.
        curl

[Validation]
Checksum=yes

[Runtime]
RuntimeSize=8G
