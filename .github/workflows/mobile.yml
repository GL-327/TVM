name: Mobile packages

# Debug APK (Linux + Android SDK) and an unsigned/ad-hoc IPA zip (macOS +
# Xcode). Neither artifact is a store release. The IPA will not install on a
# phone until it is re-signed with an Apple team (Sideloadly, AltStore, or Xcode).

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to build
        type: choice
        options:
          - all
          - ios
          - android
        default: all
  # Every push to main rebuilds the IPA and APK. Path filters previously
  # skipped a phone package when only Core or brand files changed, and the
  # Releases page kept serving yesterday's install.
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "apps/ui/**"
      - "apps/core/src/lanSessions.ts"
      - "apps/core/src/server.ts"
      - "packages/**"
      - "scripts/stamp-ui-bundle.mjs"
      - "scripts/update-feed-lib.mjs"
      - "scripts/native-api.json"
      - ".github/workflows/mobile.yml"

jobs:
  android-apk:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.package != 'ios'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 250
      - name: Skip when the Android tree is not in this commit
        id: android
        run: |
          if [ -f apps/android/settings.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/android is not in this tree; skipping APK."
          fi
      - uses: actions/setup-node@v4
        if: steps.android.outputs.present == 'true'
        with:
          node-version: 22
      - run: node apps/android/check-project.mjs
        if: steps.android.outputs.present == 'true'
      - uses: actions/setup-java@v4
        if: steps.android.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      # No setup-android action. It insists on installing the long-obsolete
      # `tools` package, which is gone from the SDK repository, so sdkmanager
      # exits 1 and takes the whole run red even when the iOS job produced its
      # IPA. The ubuntu runner already ships a complete Android SDK with
      # ANDROID_HOME set; all it needs is the licences accepted.
      - name: Accept Android SDK licences
        if: steps.android.outputs.present == 'true'
        run: |
          test -d "$ANDROID_HOME" || { echo "No Android SDK on this runner"; exit 1; }
          mkdir -p "$ANDROID_HOME/licenses"
          # Published SDK licence hashes; accepting them is what the removed
          # action did, without touching sdkmanager's package list.
          printf '8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Bundle the production UI into the Android app
        if: steps.android.outputs.present == 'true'
        run: |
          corepack pnpm install --frozen-lockfile
          node apps/android/bundle-ui.mjs
          node scripts/export-access.mjs
          node apps/android/export-fallback-catalog.mjs
          node scripts/write-build-info.mjs android
          # Stamped exactly as the android-ui feed is, so the app can tell
          # whether a published interface is newer than the one it carries.
          node scripts/stamp-ui-bundle.mjs apps/android/app/src/main/assets/ui android
          test -f apps/android/app/src/main/assets/ui/index.html
          test -f apps/android/app/src/main/assets/ui/build-info.json
          test -f apps/android/app/src/main/assets/BuildInfo.json
          test -f apps/android/app/src/main/assets/Access.json
      # TVM_ANDROID_SIGNING holds the key every APK is signed with, so a new
      # one installs over the last. First line: the keystore password. Rest:
      # the PKCS12 keystore, base64. Without it the APK gets a throwaway debug
      # key and Android refuses to install it over an older TVM.
      - name: Unpack the TVM signing key
        if: steps.android.outputs.present == 'true'
        env:
          TVM_ANDROID_SIGNING: ${{ secrets.TVM_ANDROID_SIGNING }}
        run: |
          set -euo pipefail
          if [ -z "${TVM_ANDROID_SIGNING:-}" ]; then
            echo "::warning::TVM_ANDROID_SIGNING is not set. This APK will not install over an older TVM without uninstalling it first."
            exit 0
          fi
          secret="$(printf '%s\n' "$TVM_ANDROID_SIGNING" | tr -d '\r')"
          password="$(printf '%s\n' "$secret" | sed -n 1p)"
          echo "::add-mask::$password"
          printf '%s\n' "$secret" | sed -n '2,$p' | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/tvm-android.p12"
          echo "TVM_ANDROID_KEYSTORE=$RUNNER_TEMP/tvm-android.p12" >> "$GITHUB_ENV"
          echo "TVM_ANDROID_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Assemble debug APK
        if: steps.android.outputs.present == 'true'
        working-directory: apps/android
        run: chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - name: Check the APK signature
        if: steps.android.outputs.present == 'true'
        run: |
          set -euo pipefail
          apk="$(ls apps/android/app/build/outputs/apk/debug/*.apk | head -1)"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          if [ -n "${TVM_ANDROID_KEYSTORE:-}" ] && grep -q "CN=Android Debug" apk-signature.txt; then
            echo "::error::The signing key was provided but the APK is still signed with a debug key."
            exit 1
          fi
      # A real install on a real Android system, before anything is published:
      # the APK must install, open, start its core and reach the sign-in screen.
      - name: Let the emulator use KVM
        if: steps.android.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the APK on an Android emulator
        if: steps.android.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Run twice at most: the emulator's Play services sometimes crash and
          # take the app down with them, which says nothing about TVM.
          script: node scripts/android-smoke.mjs "$(ls apps/android/app/build/outputs/apk/debug/*.apk | head -1)" android-smoke || node scripts/android-smoke.mjs "$(ls apps/android/app/build/outputs/apk/debug/*.apk | head -1)" android-smoke
      - uses: actions/upload-artifact@v4
        if: always() && steps.android.outputs.present == 'true'
        with:
          name: tvm-android-smoke
          path: android-smoke
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: steps.android.outputs.present == 'true'
        with:
          name: tvm-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # One stable "android" release that always holds the newest APK, so the
      # Releases page shows a single obvious Android download instead of an
      # artifact buried in a run that expires after 90 days.
      - name: Publish the Android release
        if: steps.android.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp apps/android/app/build/outputs/apk/debug/*.apk release/TVM.apk
          SHA="$(git rev-parse --short HEAD)"
          if [ -n "${TVM_ANDROID_KEYSTORE:-}" ]; then
            SIGNED="Signed with TVM's own key, so a newer APK installs over this one and keeps your sign-in."
          else
            SIGNED="Signed with a one-off debug key. If an older TVM is installed, uninstall it first or Android will say the app is not installed."
          fi
          cat > release/NOTES.md <<EOF
          **Android phone, tablet and Android TV.**

          | | |
          |---|---|
          | Download | \`TVM.apk\` |
          | Build | \`$SHA\` |
          | Minimum | Android 8.0 (API 26) |

          ### Set up
          1. Download **TVM.apk** below, on the phone itself.
          2. Open it from the notification or from Files. Android asks whether to
             allow installs from this source — allow it, then press Install.
          3. Open TVM. It starts its own core on the phone; nothing else to run.
          4. Sign in, or press **I'm a dev** and enter the developer code.

          Android TV has no browser, so sideload it from a computer instead:
          \`adb connect <tv-ip>\` then \`adb install TVM.apk\`.

          ### Keeping it current
          TVM refreshes its interface from GitHub every time it opens. The app
          around that interface only changes when you install an APK, so when
          **Account → Updates** says a newer app is needed, come back here and
          install this file again. Updates also shows which build you have.

          This is a private test build, not a Play Store release.
          $SIGNED
          Before publishing, CI installed this APK on an Android 14 emulator,
          opened it and checked it reached the sign-in screen.
          EOF
          gh release create android --title "Android — phone, tablet & TV" --notes-file release/NOTES.md 2>/dev/null \
            || gh release edit android --title "Android — phone, tablet & TV" --notes-file release/NOTES.md
          # One file per platform: drop anything an older build left behind.
          for old in $(gh release view android --json assets --jq '.assets[].name' 2>/dev/null || true); do
            [ "$old" = "TVM.apk" ] || gh release delete-asset android "$old" --yes || true
          done
          gh release upload android release/TVM.apk --clobber
          bash scripts/publish-device-package.sh release/TVM.apk

  ios-ipa:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.package != 'android'
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 250
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace and bundle the production UI into the iOS app
        run: |
          pnpm install --frozen-lockfile
          node scripts/export-access.mjs
          node apps/ios/export-fallback-catalog.mjs
          node apps/ios/generate-app-icon.mjs
          node apps/ios/bundle-ui.mjs
          # build-info.json, changelog.json and CHANGELOG.md, stamped exactly as
          # the ios-ui feed is.
          node apps/ios/write-changelog.mjs
          node scripts/write-build-info.mjs ios
          test -f apps/ios/TVM/BundledUI/build-info.json
          test -f apps/ios/TVM/BuildInfo.json
          test -f apps/ios/TVM/Access.json
          test -f apps/ios/TVM/BundledUI/index.html
          test -f apps/ios/TVM/BundledUI/changelog.json
          test -d apps/ios/TVM/BundledUI/assets
      - name: Validate Xcode project (standalone app + bundled UI)
        run: node apps/ios/check-project.mjs
      - name: Install native playback framework
        working-directory: apps/ios
        run: pod install --repo-update
      - name: Compile and test on iOS Simulator
        working-directory: apps/ios
        run: |
          DESTINATION=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          names = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      names.append(device["name"])
          for preferred in ("iPhone 16", "iPhone 15", "iPhone 14"):
              for name in names:
                  if preferred in name:
                      print(name)
                      raise SystemExit
          if names:
              print(names[0])
          PY
          )
          if [ -z "$DESTINATION" ]; then
            echo "No iPhone simulator available"
            exit 1
          fi
          echo "Testing on $DESTINATION"

          # Build and test are separated: xcodebuild reports both as exit 65,
          # and "compile failed" and "a test failed" need different fixes.
          run_xcode() {
            local phase="$1"; shift
            set -o pipefail
            if xcodebuild "$@" 2>&1 | tee "/tmp/xcodebuild-$phase.log"; then
              return 0
            fi
            echo "::group::$phase output"
            # Surface the real error. The full log needs admin rights to
            # download, so the useful lines are promoted to annotations.
            grep -E "error:|error :|Testing failed|failed \\(|Undefined symbol|cannot find|XCTAssert" "/tmp/xcodebuild-$phase.log" \
              | grep -v "0 failures" | sort -u | head -30 \
              | while IFS= read -r line; do echo "::error::[$phase] $line"; done
            echo "::endgroup::"
            return 1
          }

          run_xcode build -workspace TVM.xcworkspace -scheme TVM \
            -destination "platform=iOS Simulator,name=$DESTINATION" \
            -derivedDataPath build/sim \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO build-for-testing

          run_xcode test -workspace TVM.xcworkspace -scheme TVM \
            -destination "platform=iOS Simulator,name=$DESTINATION" \
            -derivedDataPath build/sim \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Compile ad-hoc device app and zip IPA
        working-directory: apps/ios
        run: |
          # Ad-hoc identity "-" produces a real iphoneos TVM.app. It is not
          # installable until re-signed. CODE_SIGNING_ALLOWED=NO is omitted so
          # the ad-hoc signer can stamp the binary. package-unsigned-ipa.sh then
          # thins fat frameworks (MobileVLCKit) to arm64 and ad-hoc signs them
          # so Sideloadly does not fail with "Invalid file".
          xcodebuild -workspace TVM.xcworkspace -scheme TVM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            EXCLUDED_ARCHS="i386 x86_64" \
            build
          chmod +x package-unsigned-ipa.sh
          ./package-unsigned-ipa.sh
      # The ios-ui interface feed is published by ui-feed.yml on every push to
      # main, so it always describes main, not only commits that rebuild the IPA.
      - uses: actions/upload-artifact@v4
        with:
          name: tvm-ios-unsigned-ipa
          path: apps/ios/build/TVM-unsigned.ipa
          if-no-files-found: error

      # One stable "ios" release that always holds the newest IPA.
      - name: Publish the iOS release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp apps/ios/build/TVM-unsigned.ipa release/TVM.ipa
          SHA="$(git rev-parse --short HEAD)"
          cat > release/NOTES.md <<EOF
          **iPhone and iPad.**

          | | |
          |---|---|
          | Download | \`TVM.ipa\` |
          | Build | \`$SHA\` |
          | Minimum | iOS 15 |

          ### Set up
          This IPA is **unsigned**. Apple does not let an app outside the App
          Store install itself, so you sign it with your own free Apple ID. Do
          this on a computer:

          1. Download **TVM.ipa** below.
          2. Install [Sideloadly](https://sideloadly.io) (or AltStore).
          3. Plug the iPhone in, drag the IPA into Sideloadly, enter your Apple
             ID, and press Start.
          4. On the iPhone: **Settings → General → VPN & Device Management**,
             then trust your developer certificate.
          5. Open TVM. It runs its own core on the phone; nothing else to run.
          6. Sign in, or press **I'm a dev** and enter the developer code.

          A free Apple ID signature lasts 7 days. Running Sideloadly again
          renews it and keeps everything you have saved.

          ### Keeping it current
          TVM refreshes its interface from GitHub every time it opens. The app
          around that interface only changes when you install an IPA, so when
          **Account → Updates** says a newer app is needed, come back here and
          install this file again. Updates also shows which build you have.
          EOF
          gh release create ios --title "iOS — iPhone & iPad" --notes-file release/NOTES.md 2>/dev/null \
            || gh release edit ios --title "iOS — iPhone & iPad" --notes-file release/NOTES.md
          # One file per platform: drop anything an older build left behind.
          for old in $(gh release view ios --json assets --jq '.assets[].name' 2>/dev/null || true); do
            [ "$old" = "TVM.ipa" ] || gh release delete-asset ios "$old" --yes || true
          done
          gh release upload ios release/TVM.ipa --clobber
          bash scripts/publish-device-package.sh release/TVM.ipa
