name: Mobile packages

# Debug APK (Linux + Android SDK) and an unsigned/ad-hoc IPA zip (macOS +
# Xcode). Neither artifact is a store release. The IPA will not install on a
# phone until it is re-signed with an Apple team (Sideloadly, AltStore, or Xcode).

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to build
        type: choice
        options:
          - all
          - ios
          - android
        default: all
  push:
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "apps/ui/**"
      - "apps/core/src/lanSessions.ts"
      - "apps/core/src/server.ts"
      - "packages/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/ios/**"
      - "apps/ui/**"
      - "apps/core/src/lanSessions.ts"
      - "apps/core/src/server.ts"
      - "packages/**"
      - ".github/workflows/mobile.yml"

jobs:
  android-apk:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.package != 'ios'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when the Android tree is not in this commit
        id: android
        run: |
          if [ -f apps/android/settings.gradle.kts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "apps/android is not in this tree; skipping APK."
          fi
      - uses: actions/setup-node@v4
        if: steps.android.outputs.present == 'true'
        with:
          node-version: 22
      - run: node apps/android/check-project.mjs
        if: steps.android.outputs.present == 'true'
      - uses: actions/setup-java@v4
        if: steps.android.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        if: steps.android.outputs.present == 'true'
      - name: Assemble debug APK
        if: steps.android.outputs.present == 'true'
        working-directory: apps/android
        run: chmod +x gradlew && ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: steps.android.outputs.present == 'true'
        with:
          name: tvm-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-ipa:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.package != 'android'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace and bundle the production UI into the iOS app
        run: |
          pnpm install --frozen-lockfile
          node apps/ios/export-fallback-catalog.mjs
          node apps/ios/generate-app-icon.mjs
          node apps/ios/bundle-ui.mjs
          node -e 'require("fs").writeFileSync("apps/ios/TVM/BundledUI/build-info.json", JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,player:"MobileVLCKit-3.6.0"}))'
          test -f apps/ios/TVM/BundledUI/index.html
          test -d apps/ios/TVM/BundledUI/assets
      - name: Validate Xcode project (standalone app + bundled UI)
        run: node apps/ios/check-project.mjs
      - name: Install native playback framework
        working-directory: apps/ios
        run: pod install --repo-update
      - name: Compile and test on iOS Simulator
        working-directory: apps/ios
        run: |
          DESTINATION=$(python3 - <<'PY'
          import json, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          names = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      names.append(device["name"])
          for preferred in ("iPhone 16", "iPhone 15", "iPhone 14"):
              for name in names:
                  if preferred in name:
                      print(name)
                      raise SystemExit
          if names:
              print(names[0])
          PY
          )
          if [ -z "$DESTINATION" ]; then
            echo "No iPhone simulator available"
            exit 1
          fi
          echo "Testing on $DESTINATION"
          xcodebuild -workspace TVM.xcworkspace -scheme TVM \
            -destination "platform=iOS Simulator,name=$DESTINATION" \
            -derivedDataPath build/sim \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO test
      - name: Compile ad-hoc device app and zip IPA
        working-directory: apps/ios
        run: |
          # Ad-hoc identity "-" produces a real iphoneos TVM.app. It is not
          # installable until re-signed. CODE_SIGNING_ALLOWED=NO is omitted so
          # the ad-hoc signer can stamp the binary. package-unsigned-ipa.sh then
          # thins fat frameworks (MobileVLCKit) to arm64 and ad-hoc signs them
          # so Sideloadly does not fail with "Invalid file".
          xcodebuild -workspace TVM.xcworkspace -scheme TVM \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            EXCLUDED_ARCHS="i386 x86_64" \
            build
          chmod +x package-unsigned-ipa.sh
          ./package-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tvm-ios-unsigned-ipa
          path: apps/ios/build/TVM-unsigned.ipa
          if-no-files-found: error
