name: Desktop & Roku packages

# The iOS and Android releases are published by mobile.yml, which already
# builds those artifacts. This workflow owns the two platforms that had no
# release path at all, so that the Releases page carries one obvious download
# for every platform TVM supports.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to build
        type: choice
        options:
          - all
          - desktop
          - roku
        default: all
  push:
    branches: [main]

jobs:
  desktop:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.package != 'roku'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The update manifest carries the changelog.
          fetch-depth: 250
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The Electron dependency is a castlabs fork carrying Widevine. Downloading
      # it is a ~150MB no-op here: this package is the core + UI bundle that the
      # launch scripts run, matching what scripts/publish-app.ps1 produces.
      - name: Build core and UI
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @tvm/core run build
          pnpm --filter @tvm/ui run build

      - name: Stage the desktop package
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p stage/core stage/ui
          cp -r apps/core/dist/. stage/core/
          cp -r apps/ui/dist/. stage/ui/
          cp scripts/launch-tvm.sh scripts/launch-tvm.cmd scripts/launch-tvm.ps1 stage/
          cp TVM.sh TVM-windowed.sh TVM.command TVM-windowed.command stage/
          # Windows gets the same two entry points as macOS and Linux.
          cp TVM.cmd TVM-windowed.cmd stage/
          cp docs/DESKTOP.md stage/README.md
          cp package.json stage/
          chmod +x stage/launch-tvm.sh stage/TVM.sh stage/TVM-windowed.sh stage/TVM.command stage/TVM-windowed.command
          # Core finds this beside itself and knows it is a package, at this commit.
          node -e 'const info=JSON.stringify({commit:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,version:process.env.VERSION,builtAt:new Date().toISOString()});require("fs").writeFileSync("stage/build-info.json",info);require("fs").writeFileSync("stage/core/build-info.json",info)'
          mkdir -p release
          # What an installed copy downloads to update itself: Core and the
          # interface only, in the plain ustar form its extractor accepts.
          tar --format=ustar -czf release/tvm-app.tar.gz -C stage core ui
          node scripts/write-update-feed.mjs --channel desktop --asset release/tvm-app.tar.gz --out release/desktop.json
          rm -rf check-app && mkdir check-app && tar -xzf release/tvm-app.tar.gz -C check-app
          test -f check-app/core/index.js
          test -f check-app/core/build-info.json
          test -f check-app/ui/index.html
          # One download for all three systems. A zip opens with a double-click
          # on Windows, which a tarball does not.
          (cd stage && zip -q -r "$GITHUB_WORKSPACE/release/TVM-desktop.zip" .)
          rm -rf check-zip && mkdir check-zip && unzip -q "release/TVM-desktop.zip" -d check-zip
          test -f check-zip/core/index.js
          test -f check-zip/ui/index.html
          test -f check-zip/TVM.cmd
          test -f check-zip/TVM.command
          bash -n stage/launch-tvm.sh
          bash -n stage/TVM-windowed.sh

      - name: Publish the Desktop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          cat > release/NOTES.md <<EOF
          **Windows, macOS and Linux.**

          | | |
          |---|---|
          | Download | \`TVM-desktop.zip\` |
          | Build | \`$SHA\` |
          | Needs | [Node.js 22+](https://nodejs.org) |

          One zip for all three systems. It carries TVM's core and its
          interface; your browser is the screen.

          ### Set up

          1. Install [Node.js 22 or newer](https://nodejs.org) if you have not.
          2. Download **TVM-desktop.zip** and extract it anywhere — Desktop is fine.
          3. Start it:
             - **Windows** — double-click \`TVM.cmd\` (or \`TVM-windowed.cmd\`).
               SmartScreen may warn about an unknown publisher: *More info →
               Run anyway*.
             - **macOS** — right-click \`TVM.command\` → Open, and confirm once.
               macOS blocks a plain double-click the first time.
             - **Linux** — \`chmod +x TVM.sh && ./TVM.sh\`
          4. TVM opens at \`http://127.0.0.1:7345/\`. Leave the window running;
             that is TVM itself, not just a page.
          5. Sign in, or press **I'm a dev** and enter the developer code.

          Phones and Rokus on your network talk to this machine, so it is worth
          leaving on.

          ### Keeping it current

          It updates itself. On opening, it asks GitHub whether a newer build
          exists, downloads it, checks its SHA-256, and restarts into it. You
          only come back here if you delete the folder. Turn it off in
          **Settings** if you would rather press Apply yourself, and see which
          build you are on under **Account → Updates**.

          ### From a git checkout instead

          \`\`\`bash
          git clone https://github.com/GL-327/TVM.git
          cd TVM
          chmod +x TVM-windowed.sh scripts/*.sh
          ./scripts/setup-desktop.sh --with-media
          ./TVM-windowed.sh
          \`\`\`

          A checkout runs the Electron kiosk and updates with \`git pull\`
          rather than by downloading a build. On Windows, double-click
          \`TVM-windowed.cmd\` after \`pnpm install\`. Details in
          [docs/DESKTOP.md](https://github.com/GL-327/TVM/blob/main/docs/DESKTOP.md).
          EOF
          gh release create desktop --title "Desktop — Windows, macOS & Linux" --notes-file release/NOTES.md 2>/dev/null \
            || gh release edit desktop --title "Desktop — Windows, macOS & Linux" --notes-file release/NOTES.md
          # One file per platform: drop the older tarballs, checksums and the
          # update feed, which now has a release of its own.
          for old in $(gh release view desktop --json assets --jq '.assets[].name' 2>/dev/null || true); do
            [ "$old" = "TVM-desktop.zip" ] || gh release delete-asset desktop "$old" --yes || true
          done
          gh release upload desktop release/TVM-desktop.zip --clobber
          bash scripts/publish-device-package.sh release/TVM-desktop.zip

      # What installed copies download to update themselves. Kept off the
      # Desktop page, which is for people, in the same shape as the ios-ui and
      # android-ui feeds.
      - name: Publish the desktop update feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "The interface feed installed desktop copies read. Not a download:" \
            "people want [the Desktop release](https://github.com/GL-327/TVM/releases/tag/desktop)." \
            > release/FEED.md
          gh release create desktop-ui --prerelease --title "Desktop interface feed" --notes-file release/FEED.md 2>/dev/null \
            || gh release edit desktop-ui --prerelease --title "Desktop interface feed" --notes-file release/FEED.md
          # The bundle first, then the manifest that names it, so an installed
          # copy never reads a manifest whose bundle is missing.
          gh release upload desktop-ui release/tvm-app.tar.gz --clobber
          gh release upload desktop-ui release/desktop.json --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: tvm-desktop
          path: |
            release/TVM-desktop.zip
            release/tvm-app.tar.gz
            release/desktop.json
          if-no-files-found: error

  roku:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.package != 'desktop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Nothing here runs BrightScript, so a typo used to reach the Roku
      # itself and show as a channel that opens to a grey screen. This parses
      # and validates every .brs and component before anything is published.
      - name: Check the channel compiles
        run: npx --yes brighterscript@0.73.5 --project apps/roku/bsconfig.json

      # A Roku sideload package is just a zip with the manifest at its root.
      # No Roku SDK is involved, so this is a plain packaging + lint job.
      - name: Check the channel layout
        run: |
          set -euo pipefail
          test -f apps/roku/manifest || { echo "apps/roku/manifest is missing"; exit 1; }
          test -d apps/roku/components || { echo "apps/roku/components is missing"; exit 1; }
          test -d apps/roku/source || { echo "apps/roku/source is missing"; exit 1; }
          # Every .xml component must name a script file that actually exists.
          missing=0
          while IFS= read -r ref; do
            [ -f "apps/roku/$ref" ] || { echo "missing script referenced by a component: $ref"; missing=1; }
          done < <(grep -rho 'uri="pkg:/[^"]*\.brs"' apps/roku/components | sed 's|uri="pkg:/||; s|"$||' | sort -u)
          [ "$missing" -eq 0 ] || exit 1
          echo "Channel layout OK."

      - name: Package the channel
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^major_version=\(.*\)/\1/p' apps/roku/manifest).$(sed -n 's/^minor_version=\(.*\)/\1/p' apps/roku/manifest).$(sed -n 's/^build_version=\(.*\)/\1/p' apps/roku/manifest)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p release
          # Which build is on the television. A sideloaded channel is installed
          # by hand, so without this nobody can tell one from another.
          SHA="$(git rev-parse --short HEAD)"
          printf 'tvm_commit=%s\ntvm_built_at=%s\n' "$SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> apps/roku/manifest
          grep '^tvm_commit=' apps/roku/manifest
          (cd apps/roku && zip -q -r "$GITHUB_WORKSPACE/release/TVM-roku.zip" . -x 'bsconfig.json' '*.md')
          unzip -l release/TVM-roku.zip | head -20

      - name: Publish the Roku release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          cat > release/NOTES.md <<EOF
          **Roku streaming players and Roku TV.**

          | | |
          |---|---|
          | Download | \`TVM-roku.zip\` |
          | Channel version | \`$VERSION\` |
          | Build | \`$SHA\` |

          ### Set up (sideload)
          Roku calls this "developer mode". The channel is not in the Channel
          Store, so it is uploaded to the box from a browser.

          1. **The Roku needs TVM running on your computer first.** Start the
             desktop TVM and sign in as the dev there, or the Roku has nothing
             to talk to.
          2. On the Roku remote press: **Home ×3, Up ×2, Right, Left, Right, Left, Right**.
          3. Enable developer mode, set a password, and note the IP address shown.
             The Roku restarts.
          4. In a browser on the same network go to \`http://<that-ip>\` and sign
             in with username \`rokudev\` and the password you set.
          5. Upload **TVM-roku.zip** and press **Install**. TVM appears on the
             Roku home screen.
          6. Open it. It finds the computer running TVM by itself; if it cannot,
             type that computer's address on the waiting screen.

          ### Keeping it current
          A Roku cannot update a sideloaded channel by itself, so this one is
          installed by hand: when the channel says a newer one is out, upload
          this zip again the same way. Everything the channel shows comes from
          the computer running TVM, so most changes reach it without any new
          upload at all.

          A sideloaded channel stays until you re-image the device.
          EOF
          gh release create roku --title "Roku — streaming players & Roku TV" --notes-file release/NOTES.md 2>/dev/null \
            || gh release edit roku --title "Roku — streaming players & Roku TV" --notes-file release/NOTES.md
          # One file per platform.
          for old in $(gh release view roku --json assets --jq '.assets[].name' 2>/dev/null || true); do
            [ "$old" = "TVM-roku.zip" ] || gh release delete-asset roku "$old" --yes || true
          done
          gh release upload roku release/TVM-roku.zip --clobber
          bash scripts/publish-device-package.sh release/TVM-roku.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tvm-roku
          path: release/TVM-roku.zip
          if-no-files-found: error
