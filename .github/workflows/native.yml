name: Native Windows

on:
  push:
    branches: [main]
  pull_request:
    paths: ['native/**', 'apps/core/**', 'apps/ui/**', 'packages/**', 'scripts/launch-tvm*', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.github/workflows/native.yml']
  workflow_dispatch:

jobs:
  native:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure
        run: cmake -S native -B native/build -A x64
      - name: Build
        run: cmake --build native/build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: Test native update verification
        shell: pwsh
        run: ./native/tests/update_native_tests.ps1
      - name: Render desktop and portrait snapshots
        shell: pwsh
        run: |
          foreach ($size in @('1920x1080', '1280x720', '390x844', '568x320')) {
            $process = Start-Process native/build/Release/tvm.exe -ArgumentList '--snapshot', "native/build/home-$size.png", '--size', $size -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Snapshot failed at $size" }
          }
          $process = Start-Process native/build/Release/tvm.exe -ArgumentList '--snapshot', 'native/build/settings-light.png', '--size', '390x844', '--theme', 'light', '--screen', 'settings' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Light theme snapshot failed' }
      - name: Render glass stills and animation frames
        shell: pwsh
        run: |
          $out = 'native/build/glass'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $art = @{ lighthouse = $null; bright = 'native/tools/snapshot-art/bright.jpg'; dark = 'native/tools/snapshot-art/dark.jpg' }
          foreach ($name in $art.Keys) {
            foreach ($theme in @('dark', 'light')) {
              $arguments = @('--snapshot', "$out/home-$name-$theme.png", '--size', '1920x1080', '--theme', $theme)
              if ($art[$name]) { $arguments += @('--art', $art[$name]) }
              $process = Start-Process native/build/Release/tvm.exe -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
              if ($process.ExitCode -ne 0) { throw "Glass still failed: $name $theme" }
            }
          }
          foreach ($name in @('bright', 'dark')) {
            foreach ($theme in @('dark', 'light')) {
              $process = Start-Process native/build/Release/tvm.exe -ArgumentList '--snapshot', "$out/home-$name-$theme-frosted.png", '--size', '1920x1080', '--theme', $theme, '--glass', 'frosted', '--art', $art[$name] -Wait -PassThru -WindowStyle Hidden
              if ($process.ExitCode -ne 0) { throw "Frosted still failed: $name $theme" }
            }
          }
          $process = Start-Process native/build/Release/tvm.exe -ArgumentList '--frames', "$out/frames-buttons-frosted", '--scenario', 'buttons', '--size', '1280x720', '--glass', 'frosted', '--art', 'native/tools/snapshot-art/bright.jpg' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Frosted animation frames failed' }
          foreach ($screen in @('live', 'library', 'search', 'search-empty', 'search-typing', 'player', 'player-cc', 'player-audio', 'player-quality', 'player-speed', 'details', 'chooser', 'chooser-edit', 'chooser-sheet', 'profile-menu', 'settings', 'settings-language', 'details-series', 'details-series-open', 'downloads', 'downloads-empty', 'downloads-list', 'downloads-open')) {
            $process = Start-Process native/build/Release/tvm.exe -ArgumentList '--snapshot', "$out/page-$screen.png", '--size', '1920x1080', '--screen', $screen, '--art', 'native/tools/snapshot-art/bright.jpg' -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Page still failed: $screen" }
          }
          $process = Start-Process native/build/Release/tvm.exe -ArgumentList '--snapshot', "$out/page-details-back-focused.png", '--size', '1920x1080', '--screen', 'details', '--keys', 'Up', '--art', 'native/tools/snapshot-art/bright.jpg' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Details focus still failed' }
          foreach ($scenario in @('nav-all-tabs', 'hover-leave', 'player-controls', 'nav-intro', 'tab-switch', 'buttons', 'orb', 'menu', 'logo-reveal', 'rail-scroll', 'card-hover')) {
            $process = Start-Process native/build/Release/tvm.exe -ArgumentList '--frames', "$out/frames-$scenario", '--scenario', $scenario, '--size', '1280x720', '--art', 'native/tools/snapshot-art/bright.jpg' -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Animation frames failed: $scenario" }
          }
          # The icon the built exe carries (taskbar, title bar, shortcuts), at the large size Explorer shows.
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path native/build/Release/tvm.exe))
          $icon.ToBitmap().Save("$out/exe-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
      - uses: actions/upload-artifact@v4
        with:
          name: tvm-native-glass-snapshots
          path: native/build/glass
          if-no-files-found: error
      - name: Package
        shell: pwsh
        run: |
          ./native/package.ps1 -Configuration Release
      - name: Smoke test packaged Core and browser UI
        shell: pwsh
        run: |
          Copy-Item native/build/Release/tvm_core_check.exe native/package/
          $env:TVM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'tvm-native-smoke'
          New-Item -ItemType Directory -Force -Path $env:TVM_DATA_DIR | Out-Null
          '{"language":"en","autoUpdate":false}' | Set-Content (Join-Path $env:TVM_DATA_DIR 'prefs.json')
          native/package/tvm_core_check.exe $env:TVM_DATA_DIR 17346
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native Core did not start' }
          $ui = Invoke-WebRequest http://127.0.0.1:17346/donate -UseBasicParsing
          if ($ui.Content -notmatch '<div id="root">') { throw 'Packaged web UI is missing' }
      - name: Build single-file installer (TVM.exe)
        shell: pwsh
        run: |
          ./native/installer/build-setup.ps1 -SkipPackage
      - name: Test single-file installer (TVM.exe)
        shell: pwsh
        run: |
          ./native/installer/test-setup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tvm-native-windows
          path: |
            native/dist/TVM.exe
            native/TVM-native-windows.zip
            native/build/home-*.png
            native/build/settings-light.png
          if-no-files-found: error
      # Installed copies update from TVM-native-windows.zip on this pre-release
      # channel (app.cpp and update-native.ps1 read the asset's label, the full
      # commit). TVM.exe itself is published on TVM Downloads below.
      - name: Publish the Windows update channel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $title = 'Update channel · Windows app'
          $notes = "> **Not a download.** Get **TVM.exe** from [TVM Downloads](https://github.com/GL-327/TVM/releases/latest).`n> Installed Windows copies read this to update themselves."
          gh release view native-windows *> $null
          if ($LASTEXITCODE -ne 0) { gh release create native-windows --prerelease --latest=false --target $env:GITHUB_SHA --title $title --notes $notes }
          else { gh release edit native-windows --prerelease --latest=false --title $title --notes $notes }
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare release' }
          gh release upload native-windows "native/TVM-native-windows.zip#$env:GITHUB_SHA" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release' }
          $stale = gh release view native-windows --json assets --jq '.assets[].name' | Where-Object { $_ -ne 'TVM-native-windows.zip' }
          foreach ($name in $stale) { gh release delete-asset native-windows $name --yes }
      - name: Publish TVM.exe to TVM Downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash scripts/publish-device-package.sh native/dist/TVM.exe
