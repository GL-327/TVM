name: Native Windows

on:
  push:
    branches: [main]
    paths: ['native/**', 'apps/core/**', 'apps/ui/**', 'packages/**', 'scripts/launch-tvm*', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'apps/core/**', 'apps/ui/**', 'packages/**', 'scripts/launch-tvm*', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.github/workflows/native.yml']
  workflow_dispatch:

jobs:
  native:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure
        run: cmake -S native -B native/build -A x64
      - name: Build
        run: cmake --build native/build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir native/build -C Release --output-on-failure
      - name: Test native update verification
        shell: pwsh
        run: ./native/tests/update_native_tests.ps1
      - name: Render desktop and portrait snapshots
        shell: pwsh
        run: |
          foreach ($size in @('1920x1080', '1280x720', '390x844', '568x320')) {
            $process = Start-Process native/build/Release/tvm.exe -ArgumentList '--snapshot', "native/build/home-$size.png", '--size', $size -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Snapshot failed at $size" }
          }
          $process = Start-Process native/build/Release/tvm.exe -ArgumentList '--snapshot', 'native/build/settings-light.png', '--size', '390x844', '--theme', 'light', '--screen', 'settings' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Light theme snapshot failed' }
      - name: Package
        shell: pwsh
        run: |
          ./native/package.ps1 -Configuration Release
      - name: Smoke test packaged Core and browser UI
        shell: pwsh
        run: |
          Copy-Item native/build/Release/tvm_core_check.exe native/package/
          $env:TVM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'tvm-native-smoke'
          New-Item -ItemType Directory -Force -Path $env:TVM_DATA_DIR | Out-Null
          '{"language":"en","autoUpdate":false}' | Set-Content (Join-Path $env:TVM_DATA_DIR 'prefs.json')
          native/package/tvm_core_check.exe $env:TVM_DATA_DIR 17346
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native Core did not start' }
          $ui = Invoke-WebRequest http://127.0.0.1:17346/donate -UseBasicParsing
          if ($ui.Content -notmatch '<div id="root">') { throw 'Packaged web UI is missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: tvm-native-windows
          path: |
            native/TVM-native-windows.zip
            native/build/home-*.png
            native/build/settings-light.png
          if-no-files-found: error
      - name: Publish native Windows download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $notes = 'Windows C++ client. Extract the whole ZIP and run tvm.exe. Includes the shared Core, responsive web UI and Node runtime. Playback uses mpv with verified automatic setup when missing. Electron is retired. See native/README.md.'
          gh release view native-windows *> $null
          if ($LASTEXITCODE -ne 0) { gh release create native-windows --latest=false --target $env:GITHUB_SHA --title 'Native Windows (C++)' --notes $notes }
          else { gh release edit native-windows --prerelease=false --latest=false --title 'Native Windows (C++)' --notes $notes }
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare release' }
          gh release upload native-windows "native/TVM-native-windows.zip#$env:GITHUB_SHA" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release' }
      - name: Publish Windows on the main downloads page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash scripts/publish-device-package.sh native/TVM-native-windows.zip
