name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Check Unix launchers
        run: |
          set -euo pipefail
          bash -n scripts/launch-tvm.sh
          bash -n scripts/setup-desktop.sh
          bash -n scripts/copy-to-desktop.sh
          bash -n scripts/roku-dev.sh
          bash -n TVM.sh
          bash -n TVM-windowed.sh
          bash -n TVM.command
          bash -n TVM-windowed.command
          bash -n TVM-roku.sh
          bash -n Install-to-Desktop.sh
          test -f docs/DESKTOP.md
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @tvm/core test
      - run: pnpm --filter @tvm/ui exec vitest run
      - run: pnpm --filter @tvm/shell test
      - run: node apps/ios/check-project.mjs
      - run: node apps/android/check-project.mjs
